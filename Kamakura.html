    <script>
        const carouselEl = document.getElementById('momijiCarousel');

        carouselEl.addEventListener('slid.bs.carousel', (e) => {
            // stop and rewind every video
            carouselEl.querySelectorAll('video').forEach(v => {
                v.pause();
                v.currentTime = 0;
            });

            // play the video on the slide that just appeared (if it has one)
            const video = e.relatedTarget.querySelector('video');
            if (video) video.play();
        });
    </script>
